name: Live results night watch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-night
  cancel-in-progress: false

jobs:
  watch-first:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Poll for four hours
        env:
          MINUTES: "240"
        run: |
          git config user.name "600 live bot"
          git config user.email "600@users.noreply.github.com"
          end=$((SECONDS + MINUTES * 60))
          publish() {
            git add data/live
            if git diff --cached --quiet; then return 0; fi
            git commit -m "Night watch $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push origin main
            git fetch origin stable
            git checkout stable
            git checkout main -- data/live
            git add data/live
            if ! git diff --cached --quiet; then
              git commit -m "Sync night watch to stable $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull --rebase origin stable
              git push origin stable
            fi
            git checkout main
          }
          while [ "$SECONDS" -lt "$end" ]; do
            python scraper/live_all.py
            publish
            sleep 30
          done
  watch-second:
    needs: watch-first
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Poll for four more hours
        env:
          MINUTES: "240"
        run: |
          git config user.name "600 live bot"
          git config user.email "600@users.noreply.github.com"
          end=$((SECONDS + MINUTES * 60))
          publish() {
            git add data/live
            if git diff --cached --quiet; then return 0; fi
            git commit -m "Night watch $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push origin main
            git fetch origin stable
            git checkout stable
            git checkout main -- data/live
            git add data/live
            if ! git diff --cached --quiet; then
              git commit -m "Sync night watch to stable $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull --rebase origin stable
              git push origin stable
            fi
            git checkout main
          }
          while [ "$SECONDS" -lt "$end" ]; do
            python scraper/live_all.py
            publish
            sleep 30
          done
