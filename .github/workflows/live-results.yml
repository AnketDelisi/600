name: Live results

on:
  schedule:
    # Serbia / Brazil / Bulgaria (25 Oct), plus the day after
    - cron: '*/5 * 24-27 10 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-results
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Pull live results
        run: python scraper/live_all.py

      - name: Commit to main
        run: |
          git config user.name "600 live bot"
          git config user.email "600@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet || git commit -m "Live results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push origin main

      - name: Sync live data to stable
        run: |
          git fetch origin stable
          git checkout stable
          git checkout main -- data/live
          git config user.name "600 live bot"
          git config user.email "600@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet || git commit -m "Sync live results to stable $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin stable
          git push origin stable
