name: Live results

on:
  schedule:
    - cron: '*/5 * 27-29 10 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-results
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Pull live results
        run: python scraper/live_all.py

      - name: Publish live updates every minute
        run: |
          git config user.name "600 live bot"
          git config user.email "600@users.noreply.github.com"
          publish() {
            git add data/live
            if git diff --cached --quiet; then return 0; fi
            git commit -m "Live results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push origin main
            git fetch origin stable
            git checkout stable
            git checkout main -- data/live
            git add data/live
            if ! git diff --cached --quiet; then
              git commit -m "Sync live results to stable $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull --rebase origin stable
              git push origin stable
            fi
            git checkout main
          }
          publish
          for i in 1 2 3 4 5 6 7 8; do
            sleep 30
            python scraper/live_serbia_fast.py
            python scraper/live_bulgaria_fast.py
            publish
          done
