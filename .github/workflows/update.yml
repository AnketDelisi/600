name: Update poll data

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml shapely

      - name: Scrape polls
        run: |
          python scraper/scrape_all.py
          python scraper/scrape_austria.py
          python scraper/scrape_czechia.py
          python scraper/scrape_poland.py
          python scraper/scrape_israel.py
          python scraper/scrape_saxony_anhalt.py
          python scraper/scrape_mecklenburg_vorpommern.py
          python scraper/scrape_berlin.py
          python scraper/scrape_netherlands.py
          python scraper/scrape_estonia.py
          python scraper/scrape_slovakia.py
          python scraper/scrape_latvia.py
          python scraper/scrape_serbia.py
          python scraper/scrape_germany.py
          python scraper/scrape_spain.py
          python scraper/scrape_greece.py
          python scraper/scrape_italy.py
          python scraper/scrape_brazil.py
          python scraper/scrape_bc.py
          python scraper/scrape_qc.py
          python scraper/scrape_uk.py
          python scraper/scrape_nz.py
          python scraper/scrape_portugal.py
          python scraper/scrape_hungary.py
          python scraper/scrape_bulgaria.py
          python scraper/scrape_bulgaria_pres.py
          python scraper/scrape_moldova.py
          python scraper/scrape_romania.py
          python scraper/scrape_denmark.py
          python scraper/scrape_finland.py

      # Tag every poll with its fieldwork method from the curated pollster
      # map (online / phone / face / mixed; unknowns stay untagged). The
      # scrapers rewrite polls.json, so this runs on every update.
      - name: Tag poll methods
        run: python scraper/tag_methods.py

      # Health canary + model audit. Both must pass before anything is
      # committed, so a silently-broken scraper (poll count dropped, latest
      # poll date went backwards, a country stopped updating) or a config
      # regression never replaces good data in main. A failure files an
      # issue at the bottom of this job.
      - name: Data health check
        run: python scraper/check_data.py --update

      - name: Model audit
        run: python scraper/audit.py

      # Calendar summary for the home view: the poll-average leader per
      # country, computed with the app's own math (a failure here must not
      # block the poll data update).
      - name: Build calendar summary
        continue-on-error: true
        run: python scraper/build_summary.py

      # The US midterms page (us/index.html) has its own pipeline: races ->
      # per-race polling -> the in-house model. It hits ~70 Wikipedia pages,
      # so it runs as a separate step that cannot block the country data
      # update if a US article changes layout (the races scraper asserts on
      # the parsed counts).
      - name: Scrape US midterms
        continue-on-error: true
        run: |
          python scraper/us_scrape_races.py
          python scraper/us_scrape_polls.py
          python scraper/us_scrape_model.py

      - name: Commit and push to main
        run: |
          git config user.name "600 bot"
          git config user.email "600@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update poll data $(date -u +%Y-%m-%d)"
          git push origin main

      - name: Sync data to stable
        run: |
          git fetch origin stable
          git checkout stable
          git checkout main -- data/
          git config user.name "600 bot"
          git config user.email "600@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Sync poll data to stable $(date -u +%Y-%m-%d)"
          git push origin stable

      # One open issue titled "[data-health] scraper alert" collects every
      # failure; a new comment carries the run link. Closed manually once
      # the data is good again.
      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[data-health] scraper alert';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The daily update failed: ${run}\n\nCheck the run log for the health check / audit output.`;
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "data-health"`,
            });
            if (found.data.total_count > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.data.items[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }