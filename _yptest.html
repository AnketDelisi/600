<!DOCTYPE html>
<html><head><title>YPTEST:pending</title></head>
<body>
<script>
const f = document.createElement('iframe');
f.src = '/?c=spain&t=prediction';
f.width = 1500; f.height = 1200;
document.body.appendChild(f);
function step(ms, fn) { setTimeout(fn, ms); }
step(10000, () => {
  try {
    const d = f.contentDocument, w = f.contentWindow;
    const row = (code) => {
      const els = d.querySelectorAll('#yp-result .yp-res');
      for (const el of els) { if (el.textContent.trim().startsWith(code)) return el.textContent.replace(/\s+/g, ' ').trim(); }
      return code + ' MISSING';
    };
    const before = 'FA[' + row('FA') + '] PODEMOS[' + row('PODEMOS') + ']';
    const inp = d.querySelector('.yp-in[data-p="sumar"]');
    inp.value = '0';
    inp.dispatchEvent(new w.Event('input', { bubbles: true }));
    step(2000, () => {
      const after = 'FA[' + row('FA') + '] PODEMOS[' + row('PODEMOS') + ']';
      document.title = 'YPTEST:' + before + ' || ' + after;
    });
  } catch (e) {
    document.title = 'YPTEST:ERR ' + e.message;
  }
});
</script>
</body></html>
