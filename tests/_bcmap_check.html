<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}iframe{width:1400px;height:4200px;border:0}</style></head>
<body>
<script>localStorage.setItem('600_lang', 'tr');</script>
<iframe id="f" src="/index.html?c=bc"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const w = f.contentWindow, d = f.contentDocument;
  const errs = [];
  w.addEventListener('error', e => errs.push('E:' + (e.message || '').slice(0, 60)));
  w.addEventListener('unhandledrejection', e => errs.push('R:' + String((e.reason && e.reason.message) || e.reason).slice(0, 60)));
  const T = (ms) => new Promise(r => setTimeout(r, ms));
  (async () => {
    let n = 0;
    while (n < 100 && !d.querySelector('.tab-trigger')) { await T(200); n++; }
    await T(2000);
    const tabs = [...d.querySelectorAll('.tab-trigger')];
    const ft = tabs.find(b => /TAHMİN$|TAHMIN$|FORECAST/i.test(b.textContent.trim())) || tabs[1];
    const out = { tabs: tabs.length };
    if (!ft) { document.title = 'DIAG ' + JSON.stringify(out); return; }
    ft.click();
    let n2 = 0;
    while (n2 < 90 && !d.getElementById('fc-map-box')) { await T(500); n2++; }
    await T(2500);
    const mb = d.getElementById('fc-map-box');
    if (mb) {
      const paths = [...mb.querySelectorAll('path[id]')];
      out.paths = paths.length;
      out.colored = paths.filter(p => (p.getAttribute('style') || '').includes('fill')).length;
      out.victoria = !!paths.find(p => p.id === 'victoriabeaconhill');
      out.insets = mb.querySelectorAll('g[transform*="scale"]').length;
      const svg = mb.querySelector('svg');
      out.viewBox = svg ? svg.getAttribute('viewBox') : '';
      const tk = paths.find(p => p.id === 'victoriabeaconhill');
      if (tk) {
        tk.dispatchEvent(new w.MouseEvent('mouseenter', { bubbles: true }));
        await T(800);
        const tip = mb.querySelector('.map-tip');
        out.tip = tip && tip.style.display === 'block' ? tip.innerText.replace(/\s+/g, ' ').slice(0, 60) : 'none';
      }
    }
    out.errs = errs.length ? errs.join(' | ') : 'none';
    document.title = 'DIAG ' + JSON.stringify(out);
  })();
});
</script>
</body></html>
