<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}iframe{width:1400px;height:4200px;border:0}</style></head>
<body>
<script>localStorage.setItem('600_lang', 'tr');</script>
<iframe id="f" src="/index.html?c=spain"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const w = f.contentWindow, d = f.contentDocument;
  const errs = [];
  w.addEventListener('error', e => errs.push('E:' + (e.message || '').slice(0, 60)));
  const T = (ms) => new Promise(r => setTimeout(r, ms));
  (async () => {
    const out = {};
    let n = 0;
    while (n < 80 && !d.querySelector('.tab-trigger')) { await T(250); n++; }
    await T(1500);
    const tabs = [...d.querySelectorAll('.tab-trigger')];
    const ft = tabs.find(b => /TAHMİN|TAHMIN|FORECAST/i.test(b.textContent.trim()));
    if (!ft) { out.ft = 'not-found'; document.title = 'DIAG ' + JSON.stringify(out); return; }
    ft.click();
    let n2 = 0;
    while (n2 < 60 && !d.getElementById('fc-upper-box')) { await T(500); n2++; }
    await T(1000);
    const ub = d.getElementById('fc-upper-box');
    if (ub) {
      const tbl = ub.parentElement.querySelector('table');
      out.table = (tbl ? tbl.innerText : '').replace(/\s+/g, ' ').slice(0, 100);
    }
    const sbtn = d.querySelector('.fc-map-btn[data-fcmode="upper"]');
    out.senBtn = sbtn ? sbtn.textContent.trim() : 'none';
    if (sbtn) sbtn.click();
    let n3 = 0;
    while (n3 < 40 && !(d.getElementById('fc-map-box')
           && d.getElementById('fc-map-box').querySelectorAll('path[id]').length === 59)) { await T(500); n3++; }
    await T(1500);
    const mb = d.getElementById('fc-map-box');
    if (mb) {
      out.mapPaths = mb.querySelectorAll('path[id]').length;
      out.mapDots = mb.querySelectorAll('.seat-dots circle').length;
    }
    const cap = d.getElementById('fc-map-cap');
    out.cap = cap ? cap.textContent.trim().slice(0, 45) : 'no-cap-el';
    const cbtn = d.querySelector('.fc-map-btn[data-fcmode="proj"]');
    if (cbtn) { cbtn.click(); await T(2500); }
    if (mb) out.projPaths = mb.querySelectorAll('path[id]').length;
    const cap2 = d.getElementById('fc-map-cap');
    out.cap2 = cap2 ? cap2.textContent.trim().slice(0, 30) : '';
    out.errs = errs.length ? errs.join(' | ') : 'none';
    document.title = 'DIAG ' + JSON.stringify(out);
  })();
});
</script>
</body></html>
