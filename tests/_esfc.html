<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}iframe{width:1400px;height:4200px;border:0}</style></head>
<body>
<script>localStorage.setItem('600_lang', 'tr');</script>
<iframe id="f" src="/index.html?c=spain"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const w = f.contentWindow, d = f.contentDocument;
  const T = (ms) => new Promise(r => setTimeout(r, ms));
  const byFill = (root) => {
    const o = {};
    root.querySelectorAll('[fill]').forEach(c => {
      const k = c.getAttribute('fill');
      if (k && k !== 'none') o[k] = (o[k] || 0) + 1;
    });
    return Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 8)
      .map(([k, v]) => k + ':' + v).join(' ');
  };
  (async () => {
    let n = 0;
    while (n < 100 && !d.querySelector('.tab-trigger')) { await T(200); n++; }
    await T(2500);
    const tabs = [...d.querySelectorAll('.tab-trigger')];
    const ft = tabs.find(b => /TAHMİN$|TAHMIN$|FORECAST/i.test(b.textContent.trim()))
      || tabs.find(b => (b.dataset.tab || '') === 'forecast');
    const out = { tabs: tabs.map(b => (b.dataset.tab || b.textContent.trim())).join(',').slice(0, 120) };
    if (!ft) { out.ft = 'not-found'; document.title = 'DIAG ' + JSON.stringify(out); return; }
    ft.click();
    let n2 = 0;
    while (n2 < 90 && !d.getElementById('fc-upper-box')) { await T(500); n2++; }
    await T(1500);
    const ub = d.getElementById('fc-upper-box');
    const pb = d.getElementById('fc-parl-box');
    out.upper = ub ? byFill(ub) : 'none';
    out.parl = pb ? byFill(pb) : 'none';
    const uc = ub ? ub.parentElement : null;
    if (uc) out.uCap = uc.innerText.replace(/\s+/g, ' ').slice(0, 160);
    out.shotBtn = !!d.getElementById('fc-upper-shot-btn');
    document.title = 'DIAG ' + JSON.stringify(out);
  })();
});
</script>
</body></html>
