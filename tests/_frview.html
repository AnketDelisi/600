<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}iframe{width:1400px;height:3400px;border:0}</style></head>
<body>
<script>localStorage.setItem('600_lang', 'tr');</script>
<iframe id="f" src="/index.html?c=france"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const d = f.contentDocument;
  setTimeout(() => {
    const det = d.querySelector('button[data-parlview="map"]');
    if (det) det.click();
    setTimeout(() => {
      const cap = [...d.querySelectorAll('div')].map(x => x.textContent)
        .filter(x => x && x.length < 200 && /harita|map/i.test(x));
      document.title = JSON.stringify({
        title: d.title || '',
        parl: !!d.querySelector('.parl-btn'),
        err: d.querySelector('#err') ? 'x' : ''
      });
    }, 2500);
  }, 9000);
});
</script>
</body></html>
