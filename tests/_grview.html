<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="/index.html?c=greece" style="width:1400px;height:900px"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const w = f.contentWindow, d = f.contentDocument;
  let err = '';
  w.addEventListener('error', e => { err += 'ERR:' + e.message + '; '; });
  w.addEventListener('unhandledrejection', e => {
    err += 'REJ:' + (e.reason && (e.reason.message || e.reason)) + '; ';
  });
  setTimeout(() => {
    const det = d.querySelector('button[data-parlview="map"]');
    if (det) det.click();
    setTimeout(() => {
      const box = d.getElementById('map-box');
      let fills = 0, sample = '';
      if (box) {
        box.querySelectorAll('path[id]').forEach(p => {
          const fl = p.style.fill || '';
          if (fl && fl !== '#E5E7EB' && fl !== 'rgb(229, 231, 235)') {
            fills++;
            if (!sample) sample = p.getAttribute('id') + '=' + fl;
          }
        });
      }
      const dots = box ? box.querySelectorAll('.seat-dots circle').length : -1;
      document.title = JSON.stringify({
        paths: box ? box.querySelectorAll('path[id]').length : -1,
        fills: fills, dots: dots, sample: sample, err: err || 'none'
      });
    }, 4000);
  }, 9000);
});
</script>
</body></html>
