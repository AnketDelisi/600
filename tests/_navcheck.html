<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden}iframe{width:100vw;height:100vh;border:0;display:block}</style>
</head><body>
<iframe id="f" src="/index.html?c=argentina"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const d = f.contentDocument;
  let n = 0;
  const t = setInterval(() => {
    n++;
    const items = d.querySelectorAll('.cnav-item');
    if ((items.length > 10) || n > 120) {
      clearInterval(t);
      const ids = [...items].map(b => b.dataset.cnav);
      document.title = 'NAV n=' + ids.length + ' argentina=' + ids.includes('argentina')
        + ' americas=' + JSON.stringify(ids.slice(0, 4))
        + ' hasAR=' + !!d.querySelector('.cnav-item[data-cnav="argentina"]');
    }
  }, 100);
});
</script>
</body></html>
