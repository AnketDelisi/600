<!doctype html>
<html><body>
<script>localStorage.setItem('600_lang','tr');</script>
<iframe id="f" src="/index.html?c=serbia" style="width:1400px;height:900px"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const w = f.contentWindow, d = f.contentDocument;
  let err = '';
  w.addEventListener('error', e => { err += 'ERR:' + e.message + '@' + e.lineno + '; '; });
  w.addEventListener('unhandledrejection', e => {
    err += 'REJ:' + (e.reason && (e.reason.message || e.reason)) + '; ';
  });
  setTimeout(() => {
    const det = d.querySelector('button[data-parlview="map"]');
    if (det) det.click();
    setTimeout(() => {
      const box = d.getElementById('map-box');
      document.title = JSON.stringify({
        parl: !!d.querySelector('.parl-btn'),
        box: !!box,
        paths: box ? box.querySelectorAll('path[id]').length : -1,
        nodes: box ? box.textContent.slice(0, 60) : '',
        err: err || 'none'
      });
    }, 3500);
  }, 9000);
});
</script>
</body></html>
