<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>localStorage.setItem('600_lang', 'tr');</script>
<iframe id="f" src="/index.html?c=turkey&t=forecast" style="width:1400px;height:900px;visibility:hidden"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  setTimeout(() => {
    const d = f.contentDocument;
    const txt = (d.body.innerText || '').replace(/\s+/g, ' ');
    const i = txt.indexOf('ANKET ORTALAMASI');
    const j = txt.indexOf('SANDALYE DAĞILIMI');
    document.title = 'FC: ' + txt.slice(i, i + 420) + ' || SEATS: ' + txt.slice(j, j + 260);
  }, 12000);
});
</script>
</body></html>
