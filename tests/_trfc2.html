<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>localStorage.setItem('600_lang', 'tr');</script>
<iframe id="f" src="/index.html?c=turkey&t=forecast" style="width:1400px;height=900px;visibility:hidden"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  setTimeout(() => {
    const d = f.contentDocument;
    const rows = [...d.querySelectorAll('#pane-forecast .fc-share-row, #pane-forecast .fc-row')]
      .map(r => r.innerText.replace(/\s+/g, ' ').slice(0, 90));
    const days = d.getElementById('filter-days');
    document.title = 'DAYS=' + (days ? days.value : '?') + ' ROWS=' + JSON.stringify(rows.slice(0, 14));
  }, 12000);
});
</script>
</body></html>
