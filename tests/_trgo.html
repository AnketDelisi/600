<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
localStorage.setItem('600_lang', 'tr');
const c = new URLSearchParams(location.search).get('c') || 'home';
const tab = new URLSearchParams(location.search).get('t') || 'polls';
location.replace(c === 'home' ? '/index.html'
  : '/index.html?c=' + c + (tab !== 'polls' ? '&t=' + tab : ''));
</script>
</body></html>
