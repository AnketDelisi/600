<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="/index.html?c=turkey" style="width:1400px;height:900px;visibility:hidden"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  setTimeout(() => {
    const d = f.contentDocument;
    const trend = d.getElementById('trend-canvas');
    const pre = document.createElement('pre');
    pre.id = 'dlurl';
    pre.textContent = trend ? trend.toDataURL('image/png') : 'NO TREND';
    document.body.appendChild(pre);
    // also the parliament svg
    const parl = d.querySelector('#parl-box svg') || d.querySelector('#map-box svg');
    const p2 = document.createElement('pre');
    p2.id = 'parlsvg';
    p2.textContent = parl ? parl.outerHTML.slice(0, 200) : 'NO PARL';
    document.body.appendChild(p2);
    document.title = 'ok';
  }, 9000);
});
</script>
</body></html>
