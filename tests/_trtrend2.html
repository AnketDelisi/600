<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>localStorage.setItem('600_lang', 'tr');</script>
<iframe id="f" src="/index.html?c=turkey" style="width:1400px;height:900px;visibility:hidden"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  setTimeout(() => {
    const d = f.contentDocument;
    const canvas = d.getElementById('trend-canvas');
    const pre = document.createElement('pre');
    pre.id = 'dlurl';
    pre.textContent = canvas ? canvas.toDataURL('image/png') : 'NO';
    document.body.appendChild(pre);
    document.title = 'ok ' + (canvas ? canvas.width + 'x' + canvas.height : '');
  }, 10000);
});
</script>
</body></html>
