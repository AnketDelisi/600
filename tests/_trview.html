<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}iframe{width:1400px;height:2400px;border:0}</style></head>
<body>
<iframe id="f" src="/index.html?c=turkey"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  setTimeout(() => {
    const d = f.contentDocument;
    const trend = d.getElementById('trend-canvas');
    const parl = d.getElementById('parl-box') || d.getElementById('map-box');
    if (trend) {
      trend.scrollIntoView();
    }
    document.title = 'trend:' + (trend ? trend.width + 'x' + trend.height : 'none')
      + ' parl:' + (parl ? (parl.querySelector('svg') ? 'svg' : 'empty') : 'none');
  }, 9000);
});
</script>
</body></html>
