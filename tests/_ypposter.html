<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="/index.html?c=turkey&t=prediction" style="width:1300px;height:900px;visibility:hidden"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  setTimeout(() => {
    const w = f.contentWindow, d = f.contentDocument;
    let err = '';
    w.addEventListener('error', e => { err += 'ERR:' + e.message + '@' + e.lineno + '; '; });
    w.addEventListener('unhandledrejection', e => {
      err += 'REJ:' + (e.reason && (e.reason.message || e.reason)) + '; ';
    });
    const sub = d.getElementById('yp-poster-sub');
    const btn = d.getElementById('yp-poster-btn');
    if (!btn) { document.title = 'NO YP POSTER BTN'; return; }
    if (sub) sub.value = 'Türkiye 2028 · benim tahminim';
    w.HTMLAnchorElement.prototype.click = function () { w.__lastDl = this.href; };
    btn.click();
    setTimeout(() => {
      const p = document.createElement('pre');
      p.id = 'dlurl';
      p.textContent = (w.__lastDl ? 'DL-OK' : 'NO DOWNLOAD') + ' | ' + err;
      document.body.appendChild(p);
    }, 6000);
  }, 9000);
});
</script>
</body></html>
